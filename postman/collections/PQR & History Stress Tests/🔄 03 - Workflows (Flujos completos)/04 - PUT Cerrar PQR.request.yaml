$kind: http-request
url: "{{base_url}}/pqrs/{{pqr_id}}/cerrar"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{admin_token}}
body:
  type: text
  content: |-
    {
        "confirmacion": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PQR cerrada en workflow', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Workflow completo ejecutado', function () {
          console.log(`✅ Workflow completado para PQR #${pm.environment.get('pqr_id')}`);
      });
    language: text/javascript
order: 4000
