$kind: http-request
url: "{{base_url}}/pqrs/{{pqr_id}}/clasificar"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{supervisor_token}}
body:
  type: text
  content: |-
    {
        "categoria": "Facturacion",
        "prioridad": "media",
        "comentario": "Clasificación automática en workflow de estrés"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('PQR clasificada en workflow', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
