services:
  postgres:
    image: postgres:16-alpine
    container_name: pqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pqr_db
      POSTGRES_USER: pqr_user
      POSTGRES_PASSWORD: pqr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pqr_user -d pqr_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: pqr-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqr-backend
    restart: unless-stopped
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src/backend:/app
      - ./src/db:/app/db
      - ./src/data/models:/data/models
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: pqr_db
      PG_USER: pqr_user
      PG_PASSWORD: pqr_password
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      HF_HOME: /data/models/hf_cache
      BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: pqr-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:

